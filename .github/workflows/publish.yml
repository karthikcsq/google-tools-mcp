name: Publish to npm

on:
  push:
    tags:
      - "v*"

# Publishes are serialized, not superseded. npm versions are immutable, so a run
# that is cancelled after `npm publish` has already succeeded would leave git and
# the registry disagreeing about what shipped.
concurrency:
  group: publish
  cancel-in-progress: false

# Read-only by default. `id-token: write` is granted to the publish job alone,
# not here, so the ungated validate job cannot mint the OIDC token npm accepts.
permissions:
  contents: read

jobs:
  # Everything that can reject a bad tag runs here, in its own job, before the
  # job holding `id-token: write` starts. A tag that does not point at main, or
  # disagrees with package.json or CHANGELOG.md, fails in seconds and never
  # reaches a job that can talk to npm.
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      # A v* tag can be pushed from any local branch, so the version check alone
      # is not enough: it would happily publish a commit that never went through
      # main. Ask the API whether the tagged commit is reachable from main and
      # refuse otherwise. Comparing main...<sha> returns "identical" when the tag
      # is exactly main's tip and "behind" when it is an older commit on main;
      # anything else ("ahead", "diverged") means the commit is not on main.
      - name: Verify tagged commit is on main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          echo "Comparison of main...${GITHUB_SHA}: ${status}"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main. Refusing to publish."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Tag, package.json, and the top CHANGELOG.md entry must all be the same
      # number. The workflow used to check only tag vs package.json, which let a
      # release ship with a changelog that never got its entry. Runs with no
      # dependencies installed so it fails before `npm ci` costs anything.
      - name: Verify tag, package.json, and CHANGELOG agree
        run: node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"

  publish:
    runs-on: ubuntu-latest
    needs: validate
    # npm Trusted Publishing exchanges this short-lived GitHub Actions identity
    # for publish access. No npm token is stored in this repository.
    permissions:
      contents: read
      id-token: write
    # This is NOT an approval gate and is not relied on as one. It is here
    # because npm's trusted publisher for this package names `npm-publish` as its
    # environment, so the OIDC identity this job presents has to carry that claim
    # or the publish is rejected. The environment has no protection rules; what
    # makes a release deliberate is who can push a v* tag in the first place.
    # See RELEASING.md, "Why tag-triggered".
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Run release checks
        run: npm run release:check

      - name: Run test suite
        run: npm run test:ci

      - name: Verify npm package contents
        run: npm run package:check

      - name: Select npm distribution tag
        id: npm-dist-tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="$(VERSION="$version" node --input-type=module -e "import { distributionTagForVersion } from './scripts/check-release.mjs'; process.stdout.write(distributionTagForVersion(process.env.VERSION));")"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.npm-dist-tag.outputs.tag }}"
