name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish
  cancel-in-progress: false

# Read-only by default. `id-token: write` is granted to the publish job alone,
# not here, so the ungated validate job cannot mint the OIDC token npm accepts.
permissions:
  contents: read

jobs:
  # Deliberately NOT gated on the npm-publish environment. `environment:` applies
  # to a whole job, so putting these checks in the publish job would make GitHub
  # request approval before they run: a reviewer would be asked to approve a tag
  # without knowing whether it even points at main. Running them in a separate
  # ungated job means a bad tag fails on its own, in seconds, without paging
  # anyone, and an approval request only appears once the tag is known-good.
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # A v* tag can be pushed from any local branch, so the version check alone
      # is not enough: it would happily publish a commit that never went through
      # main. Ask the API whether the tagged commit is reachable from main and
      # refuse otherwise. Comparing main...<sha> returns "identical" when the tag
      # is exactly main's tip and "behind" when it is an older commit on main;
      # anything else ("ahead", "diverged") means the commit is not on main.
      - name: Verify tagged commit is on main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          echo "Comparison of main...${GITHUB_SHA}: ${status}"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main. Refusing to publish."
            exit 1
          fi

      # GitHub does not treat a missing environment as an error: referencing one
      # creates it, with no protection rules. So `environment: npm-publish` on the
      # publish job below looks gated whether or not anyone ever configured it,
      # and an unconfigured environment publishes to npm with no approval at all.
      # Check for the gate here, in the ungated job, so a missing one fails in
      # seconds rather than silently publishing. See RELEASING.md.
      - name: Verify the npm-publish environment actually requires a reviewer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! body="$(gh api "repos/${GITHUB_REPOSITORY}/environments/npm-publish" 2>&1)"; then
            echo "Could not read the npm-publish environment, so this check cannot confirm"
            echo "that a human approval gate exists. Refusing rather than assuming one does."
            echo "API said: ${body}"
            exit 1
          fi
          rules="$(printf '%s' "$body" | jq -r '[.protection_rules[].type] | join(",")')"
          echo "Protection rules on npm-publish: [${rules:-none}]"
          if ! printf '%s' "$body" | jq -e '[.protection_rules[].type] | index("required_reviewers")' >/dev/null; then
            echo ""
            echo "The npm-publish environment has no required reviewers, so the publish job"
            echo "would run unapproved. Fix: Settings -> Environments -> npm-publish ->"
            echo "Required reviewers. See RELEASING.md."
            exit 1
          fi

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: validate
    # npm Trusted Publishing exchanges this short-lived GitHub Actions identity
    # for publish access. No npm token is stored in this repository.
    permissions:
      contents: read
      id-token: write
    # Requires a "npm-publish" GitHub environment with at least one required
    # reviewer (see RELEASING.md). The ancestry check in `validate` only proves
    # the tagged commit is reachable from main, not that a release was approved;
    # this environment gate adds that approval step, and its name must match
    # the "Environment name" configured on npm's trusted publisher so the
    # OIDC identity npm expects lines up with the one this job presents.
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run test:ci

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
